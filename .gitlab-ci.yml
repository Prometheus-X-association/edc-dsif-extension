image: eclipse-temurin:17-jdk

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches
    - .gradle/wrapper

stages:
  - build
  - test
  - trigger

before_script:
  - chmod +x ./gradlew

build:
  stage: build
  script:
    - ./gradlew clean assemble --no-daemon
  artifacts:
    paths:
      - extensions/dsif-catalog/build/libs/*.jar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

checkstyle:
  stage: test
  script:
    - ./gradlew checkstyleMain --no-daemon
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  script:
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    reports:
      junit: "**/build/test-results/test/*.xml"
    paths:
      - "**/build/reports/tests/"
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Trigger edc-connector pipeline to deploy with latest extension
# The deploy-staging job in edc-connector pulls both repos and builds with the extension
# Note: deploy-staging is manual, so you'll need to trigger it in the edc-connector pipeline
trigger-connector-pipeline:
  stage: trigger
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -X POST \
        --fail \
        -F "token=$CONNECTOR_TRIGGER_TOKEN" \
        -F "ref=main" \
        "https://git.startinblox.com/api/v4/projects/${EDC_CONNECTOR_PROJECT_ID}/trigger/pipeline"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  when: manual
